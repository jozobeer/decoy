name: Sync Labels

# .github/labels.yml を真実の出典として、リポのラベルを自動同期する。
# delete-other-labels: true なので、yml に無いラベルは削除される。
# 子リポにこのworkflowをコピーするときも同じ動きをする。
#
# Security note: 外部入力（PR本文・Issue本文等）を一切使わないため
# command injection の余地なし。

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/sync-labels.yml
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: true
