name: Release

# Decoy.app を Developer ID signed + notarized で release する。
# Trigger:
#   - push tag `v*` (e.g. `v0.1.0`)
#   - workflow_dispatch (tag input 必須 ― CI 上で再実行する用)
#
# Required repo secrets:
#   MACOS_CERTIFICATE_P12           base64-encoded P12 (Developer ID Application)
#   MACOS_CERTIFICATE_PASSWORD      P12 export password
#   MACOS_KEYCHAIN_PASSWORD         ephemeral keychain password (任意の文字列でよい)
#   APPLE_DEVELOPMENT_TEAM          Apple Developer Team ID (10桁)
#   APPLE_ID                        notarization 用 Apple ID
#   APPLE_APP_PASSWORD              app-specific password
#
# Security note:
# - 外部入力 (PR title / body / commit message 等) を一切 shell に渡さない
# - secrets は env: 経由でのみ展開し、heredoc/script では shell var として参照
# - tag 名は SemVer 厳密 regex で validate して filesystem 安全性を担保

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        type: string

# 同一 tag に対する push と manual dispatch の race を防ぐため、tag 名で group 化。
# github.ref は manual dispatch では branch を指すため tag-aligned にならない。
concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # workflow_dispatch では default ref が選択 branch になり、tag-input と乖離する。
      # 必ず TAG を `refs/tags/` qualified で明示 checkout する ― 同名 branch があっても
      # tag が選ばれることを保証する。
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Validate tag shape and required secrets
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # SemVer 2.0 ベース: major.minor.patch は leading zero を禁止 (0 か 1-9 で始まる)。
          # prerelease / build は dot-separated alnum/`-` identifier。空 identifier 不可。
          # OK: v0.1.0, v1.2.3-rc.1, v1.0.0+build.42, v0.0.0-test1, v1.2.3-rc.1+sha.abc
          # NG: v01.2.3, v1.0/rc1, v0.1..0, v1.0.0-, v1.0.0-.foo, v1.0.0+, v1.0.0-.+.
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*)?(\+[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*)?$ ]]; then
            echo "::error::TAG '$TAG' does not match SemVer 2.0 shape v<major>.<minor>.<patch>[-prerelease][+build]"
            exit 1
          fi
          missing=()
          [ -z "$MACOS_CERTIFICATE_P12" ] && missing+=(MACOS_CERTIFICATE_P12)
          [ -z "$MACOS_CERTIFICATE_PASSWORD" ] && missing+=(MACOS_CERTIFICATE_PASSWORD)
          [ -z "$MACOS_KEYCHAIN_PASSWORD" ] && missing+=(MACOS_KEYCHAIN_PASSWORD)
          [ -z "$APPLE_DEVELOPMENT_TEAM" ] && missing+=(APPLE_DEVELOPMENT_TEAM)
          [ -z "$APPLE_ID" ] && missing+=(APPLE_ID)
          [ -z "$APPLE_APP_PASSWORD" ] && missing+=(APPLE_APP_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install xcodegen and create-dmg
        run: brew install xcodegen create-dmg

      - name: Generate Decoy.xcodeproj
        run: xcodegen generate

      - name: Inject version into Info.plist
        run: |
          # CFBundleShortVersionString は SemVer 数値部 (x.y.z) のみ ― Apple の仕様で
          # prerelease/build suffix を含めると notarize / store でリジェクトされ得る。
          # GitHub run number を CFBundleVersion (build number) に monotonic 注入。
          # source plist は SPM 経由の `swift run` 用に literal を保持し、release では
          # ここで PlistBuddy で上書きする ($(MARKETING_VERSION) placeholder は
          # Package.swift の `-sectcreate __TEXT __info_plist` で展開されないため避ける)。
          CORE_VERSION="${TAG#v}"
          CORE_VERSION="${CORE_VERSION%%-*}"
          CORE_VERSION="${CORE_VERSION%%+*}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER:-1}"
          for plist in Sources/Decoy/Info.plist Apps/DecoyCameraExtension/Info.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $CORE_VERSION" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$plist"
          done

      - name: Import signing certificate into temporary keychain
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          # P12 file は途中 step が失敗しても必ず消す ― private key の disk 滞留を防ぐ。
          trap 'rm -f "$CERT_PATH"' EXIT
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # create-keychain が success した時点で cleanup step が見つけられるよう
          # 後続 (set-keychain-settings / import / list-keychains 等) が失敗しても
          # KEYCHAIN_PATH は GITHUB_ENV に書き出しておく。
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # -t agg ― .p12 は cert + private key の aggregate identity bundle。
          # -t cert だと cert のみ取り込まれ codesign が "no identity" で失敗する。
          security import "$CERT_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t agg -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Archive Decoy.app
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/Decoy.xcarchive"
          # version 注入は前段の "Inject version into Info.plist" で完了済。
          # project.yml は debug build を ad-hoc ("-") に固定する。release では
          # CODE_SIGN_STYLE=Automatic + DEVELOPMENT_TEAM を inject して Xcode に
          # keychain 内の Developer ID Application identity を resolve させる。
          # TODO(#76): SystemExtension が要求する制約付き entitlement のため、
          # 初回 v* tag push で archive が profile 不足で落ちる可能性が高い。
          # Developer ID provisioning profile import + manual signing への切替を別 PR で追加。
          xcodebuild archive \
            -project Decoy.xcodeproj \
            -scheme Decoy \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export signed .app from archive
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          EXPORT_DIR="$RUNNER_TEMP/export"
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          # signingStyle=automatic + developer-id method で Xcode が SystemExtension
          # を含む embedded targets の profile を自動 resolve する。
          cat > "$EXPORT_OPTIONS" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>__APPLE_DEVELOPMENT_TEAM__</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          PLIST
          # team ID をプレースホルダ経由で挿入し、heredoc 内に secret を直接書かない
          /usr/bin/sed -i '' "s/__APPLE_DEVELOPMENT_TEAM__/$APPLE_DEVELOPMENT_TEAM/" "$EXPORT_OPTIONS"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_OPTIONS"
          APP_PATH="$EXPORT_DIR/Decoy.app"
          [ -d "$APP_PATH" ] || { echo "::error::Decoy.app not found at $APP_PATH"; exit 1; }
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "EXPORT_DIR=$EXPORT_DIR" >> "$GITHUB_ENV"

      - name: Create DMG
        run: |
          # TAG は SemVer regex で validate 済 ― path injection の余地なし。
          DMG_PATH="$RUNNER_TEMP/Decoy-${TAG}.dmg"
          create-dmg \
            --volname "Decoy ${TAG}" \
            --window-size 540 380 \
            --icon-size 96 \
            --icon "Decoy.app" 140 190 \
            --app-drop-link 400 190 \
            --no-internet-enable \
            "$DMG_PATH" \
            "$EXPORT_DIR"
          [ -f "$DMG_PATH" ] || { echo "::error::DMG not created at $DMG_PATH"; exit 1; }
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_DEVELOPMENT_TEAM" \
            --wait

      - name: Staple notarization ticket
        run: xcrun stapler staple "$DMG_PATH"

      - name: Verify Gatekeeper acceptance
        run: |
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # prerelease 判定: build metadata (`+segment`) 内の hyphen は prerelease ではないので
          # 先に `+` 以降を切り落としてから `-` の有無を見る。
          # 例: v1.0.0+build-foo は prerelease=false, v1.2.3-rc.1+sha は prerelease=true。
          PRERELEASE_FLAG=()
          TAG_NO_BUILD="${TAG%%+*}"
          if [[ "$TAG_NO_BUILD" == *-* ]]; then
            PRERELEASE_FLAG=(--prerelease)
          fi
          # --verify-tag ― tag が repo に存在しなければ release create を失敗させる
          # (workflow_dispatch で typo した tag が draft release を勝手に新規作成する事故を防ぐ)。
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 既存 release が published 済 (draft でない) なら、public asset を
            # silently 上書きするのは事故のもと ― 明示削除を要求する。
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $TAG is already published. Delete it manually if re-release is intentional."
              exit 1
            fi
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --draft \
              --verify-tag \
              "${PRERELEASE_FLAG[@]}"
          fi
          gh release upload "$TAG" "$DMG_PATH" --clobber

      - name: Cleanup temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
