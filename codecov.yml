# yaml-language-server: $schema=https://json.schemastore.org/codecov

codecov:
  require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        target: 95%
        threshold: 1%
    patch:
      default:
        target: 95%
        threshold: 1%

ignore:
  # Domain は pure data only ― ロジックゼロなのでテスト不要
  - "Sources/Domain/**"
