# yaml-language-server: $schema=https://json.schemastore.org/codecov

codecov:
  require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        target: 95%
        threshold: 1%
    patch:
      default:
        target: 95%
        threshold: 1%

ignore:
  # Domain は pure data only ― ロジックゼロなのでテスト不要
  - "Sources/Domain/**"
  # DependencyInjection は wiring のみ（liveValue / testValue の一行結線）
  - "Sources/DependencyInjection/**"
  # AVFoundation 直結部分はテスト不能（実機カメラが要る）。translation と
  # lifecycle のロジックは AVCameraSource.swift / SampleBufferTranslator.swift
  # に分離済みでカバー対象
  - "Sources/AVCameraSource/AVFoundationCaptureSessionController.swift"
  # live-wiring 専用 file ― AVCaptureDevice の OS lookup と
  # authorization status の interrogation で構成。pure な認可分岐は
  # AVCameraSource.authorized(controller:status:) 経由でテスト済み
  - "Sources/AVCameraSource/AVCameraSource+Live.swift"
  # AVFoundation 直結部分 ― AVCaptureDevice.authorizationStatus / requestAccess
  # を呼ぶだけ。orchestrator 側（AVCameraPermission.swift）でカバー
  - "Sources/AVCameraPermission/AVCaptureDeviceAuthorizationProvider.swift"
  # AppKit (NSAlert / NSWorkspace) 直結部分 ― UI を出すだけでロジックなし
  - "Sources/AVCameraPermission/AppKitCameraPermissionAlertPresenter.swift"
  # live-wiring 専用 file ― live provider + live presenter を組み合わせるだけ
  - "Sources/AVCameraPermission/AVCameraPermission+Live.swift"
  # SystemExtensions framework 直結部分 ― OSSystemExtensionRequest delegate
  # と OS 越しの install 通信のみで、実 .app bundle + 署名済み環境でしか
  # 動かない。orchestrator (`SystemExtensionInstaller.swift`) 側で
  # FakeSystemExtensionActivator を使った state transition test がカバー
  - "Sources/SystemExtensionInstaller/OSSystemExtensionActivator.swift"
  # live-wiring 専用 file ― live activator を組み合わせるだけ
  - "Sources/SystemExtensionInstaller/SystemExtensionInstaller+Live.swift"
  # in-memory stub ― テストプレースホルダのみ
  - "Sources/InMemorySystemExtensionInstaller/**"
  # Decoy は Orchestrator ― actor / dispatcher / view-model を組み立てる
  # 一段の wiring のみ。ロジックは MenuBarViewModel / AppCommandDispatcher
  # 側でテスト済みなので、ここはカバー対象外。
  - "Sources/Decoy/**"
  # MenuView は SwiftUI 宣言のみ（ロジックは MenuBarViewModel へ集約）。
  # snapshot test 基盤を持っていないので除外。
  - "Sources/MenuBarUI/MenuView.swift"
