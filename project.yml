name: Decoy

# Decoy.xcodeproj は xcodegen で再生成する thin shell。
# SPM (Package.swift) が source of truth。Xcode side は SystemExtension
# bundle (#42) を embed するための器でしかない。
#
# 使い方:
#   brew install xcodegen
#   xcodegen generate
#   open Decoy.xcodeproj

options:
  bundleIdPrefix: beer.jozo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug
  groupSortPosition: top

packages:
  DecoyPackage:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      ONLY_ACTIVE_ARCH: NO
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  Decoy:
    type: application
    platform: macOS
    sources:
      - path: Sources/Decoy
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: beer.jozo.decoy
        INFOPLIST_FILE: Sources/Decoy/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Apps/Decoy/Decoy.entitlements
        # CODE_SIGN_STYLE は Manual ― CODE_SIGN_IDENTITY="-" (ad-hoc) と整合する。
        # release tag workflow では Developer ID identity / team / profile specifier を inject して上書き。
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "$(DECOY_APP_PROVISIONING_PROFILE_SPECIFIER)"
    dependencies:
      - package: DecoyPackage
        product: Domain
      - package: DecoyPackage
        product: RecorderUseCase
      - package: DecoyPackage
        product: BroadcasterUseCase
      - package: DecoyPackage
        product: AppCommandDispatcher
      - package: DecoyPackage
        product: DependencyInjection
      - package: DecoyPackage
        product: HotkeyService
      - package: DecoyPackage
        product: MenuBarUI
      # SystemExtension bundle を host .app の Contents/Library/SystemExtensions/
      # に embed する。`embed: true` (default) + `codeSign: true` で signing も伝播。
      - target: DecoyCameraExtension
        embed: true
        codeSign: true

  DecoyCameraExtension:
    # SystemExtension bundle (CMIO Camera Extension)。
    # `system-extension` type は xcodegen が `.systemextension` 拡張 + system
    # extension product type に翻訳する。
    type: system-extension
    platform: macOS
    sources:
      - path: Apps/DecoyCameraExtension
        excludes:
          - Info.plist
    # host (Broadcaster) → MachPortFrameTransport → MachPortFrameReceiver
    # → DecoyCameraExtensionStreamSource → CMIOExtensionStream の経路を
    # extension 側で組み立てるため、SPM library を直接 link する。
    # Domain は FrameTransportServiceName.mach 定数 (host / extension が握る
    # service name) と Frame entity 経路のため、MachPortFrameReceiver は
    # 受信 actor、FrameSampleBufferAdapter は Frame → CMSampleBuffer 変換。
    dependencies:
      - package: DecoyPackage
        product: Domain
      - package: DecoyPackage
        product: MachPortFrameReceiver
      - package: DecoyPackage
        product: FrameSampleBufferAdapter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: beer.jozo.decoy.CameraExtension
        INFOPLIST_FILE: Apps/DecoyCameraExtension/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Apps/DecoyCameraExtension/DecoyCameraExtension.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "$(DECOY_CAMERA_EXTENSION_PROVISIONING_PROFILE_SPECIFIER)"

schemes:
  Decoy:
    build:
      targets:
        Decoy: all
        DecoyCameraExtension: all
    run:
      config: Debug
    archive:
      config: Release
