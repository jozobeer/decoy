name: Decoy

# Decoy.xcodeproj は xcodegen で再生成する thin shell。
# SPM (Package.swift) が source of truth。Xcode side は SystemExtension
# bundle (#42) を embed するための器でしかない。
#
# 使い方:
#   brew install xcodegen
#   xcodegen generate
#   open Decoy.xcodeproj

options:
  bundleIdPrefix: beer.jozo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug
  groupSortPosition: top

packages:
  DecoyPackage:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      ONLY_ACTIVE_ARCH: NO
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  Decoy:
    type: application
    platform: macOS
    sources:
      - path: Sources/Decoy
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: beer.jozo.decoy
        INFOPLIST_FILE: Sources/Decoy/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Apps/Decoy/Decoy.entitlements
        CODE_SIGN_STYLE: Automatic
        # PR CI では unsigned build only ― DEVELOPMENT_TEAM は
        # release tag workflow で inject する。
        CODE_SIGN_IDENTITY: "-"
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
    dependencies:
      - package: DecoyPackage
        product: Domain
      - package: DecoyPackage
        product: Recorder
      - package: DecoyPackage
        product: Broadcaster
      - package: DecoyPackage
        product: AppCommandDispatcher
      - package: DecoyPackage
        product: DependencyInjection
      - package: DecoyPackage
        product: HotkeyService
      - package: DecoyPackage
        product: MenuBarUI

schemes:
  Decoy:
    build:
      targets:
        Decoy: all
    run:
      config: Debug
    archive:
      config: Release
